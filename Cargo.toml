[package]
name = "kwoc-stats-tracker"
description = "A rust script to track student's pull requests and commits to projects for KWoC."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
default-run = "kwoc-stats-tracker"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.100"
dotenvy = "0.15.7"
chrono = "0.4.42"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
serde_json = "1.0.145"
http = "1.4.0"
